<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>달토끼 귀성길</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #141938;
    --night-deep: #0b0f26;
    --moon: #f7e8b4;
    --moon-dim: #c9b983;
    --ink: #eef0ff;
    --muted: #9ea5d6;
    --red: #e0554a;
    --pine: #2c5a4d;
    --line: rgba(247, 232, 180, 0.18);
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #1d2350 0%, var(--night) 45%, var(--night-deep) 100%);
    color: var(--ink);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    padding-inline: 16px;
    padding-block: 28px 40px;
    box-sizing: border-box;
  }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .eyebrow { font-size: 12px; letter-spacing: 0.18em; color: var(--moon-dim); margin: 0 0 6px; }
  h1 {
    font-family: "Jua", "Apple SD Gothic Neo", sans-serif;
    font-weight: 400; font-size: clamp(34px, 7vw, 54px); line-height: 1;
    margin: 0; color: var(--moon); text-wrap: balance;
  }
  .tag { margin: 8px 0 0; color: var(--muted); }
  .explain { margin: 6px 0 0; color: var(--muted); font-size: 13px; max-width: 62ch; opacity: 0.85; }
  .side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .lang {
    display: inline-flex; padding: 2px; gap: 2px;
    border: 1px solid var(--line); border-radius: 999px;
  }
  .lang button {
    background: transparent; color: var(--muted); border: 0;
    font-size: 13px; padding: 4px 11px; letter-spacing: 0.04em;
  }
  .lang button[aria-pressed="true"] { background: var(--moon); color: var(--night-deep); }
  .best { font-family: "Jua", sans-serif; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  .best b { color: var(--moon); font-weight: 400; font-size: 20px; }

  .stage {
    position: relative; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; width: 100%; height: auto; cursor: pointer; }

  .over {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: rgba(11, 15, 38, 0.72); padding: 16px;
  }
  .over[hidden] { display: none; }
  .over.intro { background: rgba(11, 15, 38, 0.4); }
  .over.intro button { font-size: clamp(16px, 2.6vw, 19px); padding: 12px 28px; }
  .over h2 { font-family: "Jua", sans-serif; font-weight: 400; font-size: clamp(22px, 4.5vw, 32px); margin: 0; color: var(--moon); }
  .over .hit { margin: 0; color: var(--ink); font-size: clamp(13px, 2.6vw, 16px); }
  .over .hit q { color: var(--red); font-family: "Jua", sans-serif; }
  .over .wish { margin: 0; color: var(--muted); font-size: 13px; max-width: 40ch; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  button {
    font-family: "Jua", sans-serif; font-size: 16px; border-radius: 999px;
    padding: 9px 20px; cursor: pointer; border: 1px solid var(--moon);
    background: var(--moon); color: var(--night-deep);
  }
  button.ghost { background: transparent; color: var(--moon); }
  /* 좁은 화면에선 캔버스가 낮아서 결과창을 캔버스 아래로 펼친다 */
  @media (max-width: 640px) {
    #over { position: static; background: var(--night-deep); border-top: 1px solid var(--line); padding: 16px 12px 18px; }
    #over button { font-size: 15px; padding: 8px 16px; }
  }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }

  .how { display: flex; flex-direction: column; gap: 12px; color: var(--muted); font-size: 14px; }
  .ctrl { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; color: var(--ink); }
  .ctrl .sub {
    font-family: "Jua", sans-serif; font-size: 14px; color: var(--night-deep);
    background: var(--moon); border-radius: 999px; padding: 3px 12px 3px 10px;
    margin-left: 4px;
  }
  .ctrl .sub::before { content: "⤒ "; }
  .legend { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .legend li {
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    padding: 6px 12px 6px 8px; border: 1px solid var(--line); border-radius: 999px;
  }
  .legend .ico {
    flex: none; width: 22px; height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1;
  }
  .legend .ico svg { width: 22px; height: 22px; display: block; }
  .legend b { font-family: "Jua", sans-serif; font-weight: 400; color: var(--moon); }
  kbd {
    font-family: "Jua", sans-serif; font-size: 12px; color: var(--moon);
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 7px;
  }
  footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
  footer span { color: var(--moon); font-family: "Jua", sans-serif; }
  footer em { font-style: normal; }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" data-i18n="eyebrow">2026 한가위 특별판</p>
      <h1 data-i18n="title">달토끼 귀성길</h1>
      <p class="tag" data-i18n="tag">잔소리는 흘려버리고, 송편은 챙기고. 고향까지 즐겁게 달려 보세요!</p>
      <p class="explain" data-i18n="explain" hidden></p>
    </div>
    <div class="side">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-ko" data-lang="ko" aria-pressed="true">KO</button>
        <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="best"><span data-i18n="best">최고 기록</span> <b id="best">0</b></div>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" width="800" height="280" aria-label="달토끼 귀성길 게임 화면"></canvas>
    <div class="over intro" id="intro">
      <div class="btns"><button id="start" type="button" data-i18n="start">고향을 향해 출발!</button></div>
    </div>
    <div class="over" id="over" hidden>
      <h2 id="overTitle">잔소리에 넉다운!</h2>
      <p class="hit" id="overHit"></p>
      <p class="wish" id="overWish"></p>
      <div class="btns">
        <button id="retry" type="button" data-i18n="retry">다시 달리기</button>
        <button id="card" type="button" class="ghost" data-i18n="card">📸 카드 저장</button>
        <button id="copy" type="button" class="ghost" data-i18n="copy">기록 복사</button>
      </div>
    </div>
  </div>

  <div class="how">
    <p class="ctrl"><kbd>Space</kbd><kbd>↑</kbd><span data-i18n="jump">또는 화면 탭으로 점프</span><span class="sub" data-i18n="hold">길게 누르면 더 높이</span></p>
    <ul class="legend">
      <li>
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 22 22"><path d="M2 13 A9 8 0 0 1 20 13 Q11 17.5 2 13Z" fill="#f2b8c6"/></svg></span>
        <b data-i18n="song">송편</b><span data-i18n="songDesc">+10점</span>
      </li>
      <li>
        <span class="ico" aria-hidden="true">🧧</span>
        <b data-i18n="env">용돈 봉투</b><span data-i18n="envDesc">잠깐 무적</span>
      </li>
      <li>
        <span class="ico" aria-hidden="true">🎧</span>
        <b data-i18n="hp">헤드폰</b><span data-i18n="hpDesc">잔소리 전부 음소거</span>
      </li>
    </ul>
  </div>

  <footer><span data-i18n="footA">풍성한 한가위 보내세요.</span> <em data-i18n="footB">올 추석엔 잔소리 말고 덕담만 오가길.</em></footer>
</div>

<script>
(() => {
  const W = 800, H = 280, GROUND = 232;
  const canvas = document.getElementById('game');
  let ctx = canvas.getContext('2d'); // 기록 카드를 그릴 때 잠시 바꿔 끼운다
  const $ = id => document.getElementById(id);

  // HiDPI
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // 두 언어의 문구 목록은 같은 순서를 유지한다 (잔소리·제목은 인덱스로 짝지음)
  const T = {
    ko: {
      docTitle: '달토끼 귀성길',
      eyebrow: '2026 한가위 특별판',
      title: '달토끼 귀성길',
      tag: '잔소리는 흘려버리고, 송편은 챙기고. 고향까지 즐겁게 달려 보세요!',
      explain: '',
      best: '최고 기록',
      start: '고향을 향해 출발!',
      retry: '다시 달리기',
      copy: '기록 복사', copied: '복사됨!', copyFail: '복사 실패 — 직접 캡처해 주세요',
      card: '📸 카드 저장', cardScore: '점수', cardRecord: '신기록!', cardSongs: n => `송편 ${n}개 챙김`, cardHit: '나를 쓰러뜨린 잔소리',
      jump: '또는 화면 탭으로 점프', hold: '길게 누르면 더 높이 점프!', tip: '길게 누르면 더 높이 점프!',
      song: '송편', songDesc: '+10점',
      env: '용돈 봉투', envDesc: '잠깐 무적',
      hp: '헤드폰', hpDesc: '잔소리 전부 음소거',
      footA: '풍성한 한가위 보내세요.', footB: '올 추석엔 잔소리 말고 덕담만 오가길.',
      hud: n => `송편 × ${n}`,
      inv: '용돈 무적', yes: '네~ 네~', muted: '음소거',
      mutedAll: '🎧 잔소리 전부 음소거!', gotEnv: '🧧 용돈 획득! 무적',
      mile: km => `고향까지 ${km}km!`,
      hitBefore: '', hitAfter: (sc, n) => ` 에 쓰러짐 · ${sc}점 · 송편 ${n}개`,
      share: (sc, n, nag) => `🌕 달토끼 귀성길 ${sc}점! 송편 ${n}개 챙겼는데 "${nag}" 잔소리에 쓰러졌습니다. 풍성한 한가위 보내세요!`,
      nagCap: 150,
      nags: [
        // 학생
        '몇 등 했니?', '수능 며칠 남았지?', '어느 대학 갈 거야?', '옆집 애는 전교 1등', '공부 좀 해라', '게임 그만해',
        // 회사원
        '연봉 얼마야?', '승진은?', '그 회사 괜찮은 데야?', '이직은 왜 해?', '옆집 애는 대기업', '취업은?',
        // 주부
        '전 좀 더 부쳐라', '설거지 산더미', '음식이 좀 짜다', '시댁 먼저 가야지', '애는 언제?',
        // 남편
        '운전 교대 안 해?', '처가는 언제 가?', '누워만 있지 말고!', '고스톱 그만 쳐',
        // 공통
        '결혼은 언제?', '살 쪘네?', '연애는 하니?', '집은 샀니?', '너 몇 살이지?'
      ],
      titles: ['잔소리에 넉다운!', '잔소리 한 방에 K.O.!', '잔소리에 그로기 상태', '오늘은 여기까지… 전이나 부치자'],
      records: ['신기록! 이 정도면 용돈 두 배', '신기록! 보름달도 놀란 질주', '신기록! 송편 하나 더'],
      wishes: [
        '올 추석엔 잔소리 대신 용돈만 받으시길.',
        '보름달처럼 꽉 찬 한가위 되세요.',
        '더도 말고 덜도 말고 한가위만 같아라.',
        '송편처럼 속이 꽉 찬 한 해 되세요.',
        '귀성길은 짧고, 연휴는 길기를.'
      ]
    },
    en: {
      docTitle: 'Moon Rabbit’s Way Home',
      eyebrow: 'Chuseok 2026 Special',
      title: 'Moon Rabbit’s Way Home',
      tag: 'Tune out the nagging, grab some songpyeon, and dash home!',
      explain: 'Chuseok is Korea’s harvest holiday—think Thanksgiving, with rice cakes and relatives asking way too many questions.',
      best: 'Best',
      start: 'Head home!',
      retry: 'Run again',
      copy: 'Copy score', copied: 'Copied!', copyFail: "Couldn't copy — take a screenshot instead",
      card: '📸 Save card', cardScore: 'Score', cardRecord: 'New record!', cardSongs: n => `${n} songpyeon grabbed`, cardHit: 'Knocked out by',
      jump: 'or tap to jump', hold: 'Hold for a higher jump!', tip: 'Hold to jump higher!',
      song: 'Songpyeon', songDesc: '+10 pts',
      env: 'Cash envelope', envDesc: 'brief invincibility',
      hp: 'Headphones', hpDesc: 'mute all nagging',
      footA: 'Happy Chuseok!', footB: 'May this holiday bring more blessings than nagging.',
      hud: n => `Songpyeon × ${n}`,
      inv: 'Invincible', yes: 'Yes, yes~', muted: 'Muted',
      mutedAll: '🎧 All nagging muted!', gotEnv: '🧧 Allowance! Invincible',
      mile: km => `${km} km to home!`,
      hitBefore: 'Knocked out by ', hitAfter: (sc, n) => ` · ${sc} pts · ${n} songpyeon`,
      share: (sc, n, nag) => `🌕 Moon Rabbit’s Way Home: ${sc} pts! Grabbed ${n} songpyeon before "${nag}" knocked me out. Happy Chuseok!`,
      nagCap: 190,
      nags: [
        'Class rank?', 'Exam countdown?', 'Which college?', 'Cousin got straight A’s!', 'Go study!', 'Stop gaming!',
        'How much do you make?', 'Promoted yet?', 'Is that a good company?', 'Why switch jobs?', "Neighbor's kid got hired", 'Found a job yet?',
        'Go fry some more jeon!', 'Dishes piling up', 'A bit salty', 'In-laws first!', 'Kids when?',
        'Your turn to drive?', 'When do we see my folks?', 'Get off the couch!', 'Enough card games!',
        'Married yet?', 'Put on weight?', 'Seeing anyone?', 'Bought a house yet?', 'How old are you now?'
      ],
      titles: ['Knocked out by nagging!', 'One nag. Instant K.O.', 'Nagged senseless!', 'That’s it for today… back to frying jeon!'],
      records: ['New record! You earned double the pocket money!', 'New record! Even the moon is impressed', 'New record! Have another songpyeon!'],
      wishes: [
        'May you get allowance, not advice.',
        'Wishing you a Chuseok as full as the moon.',
        'No more, no less. May every day be like Chuseok.',
        'May your year be as full as a songpyeon.',
        'Short drive home, long holiday.'
      ]
    }
  };

  const prefs = {
    get() { try { return localStorage.getItem('dalto-lang'); } catch { return null; } },
    set(v) { try { localStorage.setItem('dalto-lang', v); } catch {} }
  };
  let lang = prefs.get() || ((navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en');
  if (!T[lang]) lang = 'ko';
  const L = () => T[lang];

  // GoatCounter 이벤트. 스크립트가 아직 안 떴거나 막혀 있으면 조용히 넘어간다
  function track(name) {
    try { window.goatcounter?.count?.({ path: name, title: name, event: true }); } catch {}
  }
  const pick = arr => Math.floor(Math.random() * arr.length);

  const store = {
    get() { try { return +localStorage.getItem('dalto-best') || 0; } catch { return 0; } },
    set(v) { try { localStorage.setItem('dalto-best', String(v)); } catch {} }
  };
  let best = store.get();
  $('best').textContent = best;

  // Stars & scenery (static-ish, generated once)
  const stars = Array.from({ length: 70 }, () => ({
    x: Math.random() * W, y: Math.random() * (GROUND - 80), r: Math.random() * 1.3 + 0.3, p: Math.random() * Math.PI * 2
  }));
  const hills = (seed, amp, base) => {
    const pts = []; for (let i = 0; i <= 40; i++) {
      const x = i * 40; pts.push([x, base - amp * (0.5 + 0.5 * Math.sin(i * 0.7 + seed) * Math.cos(i * 0.31 + seed * 2))]);
    } return pts;
  };
  const farHills = hills(1.3, 50, GROUND - 10);
  const nearHills = hills(4.1, 26, GROUND);

  let state, rabbit, obstacles, songs, items, pops, speed, dist, songCount, nextObs, nextSong, nextItem, invincible, t, holding, result, flash, tip;
  let runs = 0, cardBlob = null;

  const INVINCIBLE_SEC = 4.5;

  function reset() {
    rabbit = { x: 90, y: GROUND, vy: 0, w: 36, h: 40, onGround: true };
    obstacles = []; songs = []; items = []; pops = [];
    speed = 380; dist = 0; songCount = 0; t = 0;
    nextObs = 1.1; nextSong = 1.8; nextItem = 7 + Math.random() * 4; invincible = 0; flash = null;
    tip = runs < 2 ? 3.2 : 0; runs++;
  }
  reset(); state = 'ready';

  const score = () => Math.floor(dist / 12) + songCount * 10;

  // ---------- Input
  function startGame() {
    if (state !== 'ready') return;
    $('intro').hidden = true;
    state = 'playing';
    track(`start-${lang}`);
    press();
  }

  function press() {
    if (state !== 'playing') return;
    holding = true;
    if (rabbit.onGround) { rabbit.vy = -840; rabbit.onGround = false; }
  }
  function release() {
    holding = false;
    if (rabbit.vy < -320) rabbit.vy = -320;
  }
  window.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'over') { if (overShownAt && performance.now() - overShownAt > 450) restart(); return; }
      if (state === 'ready') { startGame(); return; }
      press();
    }
  });
  window.addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) release(); });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); state === 'ready' ? startGame() : press(); });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);

  let overShownAt = 0;
  function restart() { $('over').hidden = true; reset(); state = 'playing'; track(`retry-${lang}`); }

  $('start').addEventListener('click', startGame);
  $('retry').addEventListener('click', restart);
  $('copy').addEventListener('click', async () => {
    const txt = L().share(result.score, result.songs, L().nags[result.nag]);
    const btn = $('copy');
    track(`copy-score-${lang}`);
    try { await navigator.clipboard.writeText(txt); btn.textContent = L().copied; }
    catch { btn.textContent = L().copyFail; }
    setTimeout(() => (btn.textContent = L().copy), 1800);
  });
  // 휴대폰은 공유 시트(사진 저장·앱 공유), PC는 PNG 다운로드
  $('card').addEventListener('click', async () => {
    track(`save-card-${lang}`);
    const blob = await cardBlob;
    if (!blob) return;
    const name = `moon-rabbit-run-${result.score}.png`;
    const file = new File([blob], name, { type: 'image/png' });
    if (matchMedia('(pointer: coarse)').matches && navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });

  // ---------- Spawning
  ctx.font = '17px Jua, sans-serif';
  function nagWidth(i) {
    ctx.font = '17px Jua, sans-serif';
    return Math.max(56, Math.min(ctx.measureText(L().nags[i]).width + 22, L().nagCap));
  }
  function spawnObstacle() {
    const ni = pick(L().nags);
    const h = 34 + (Math.random() < 0.25 && speed > 480 ? 16 : 0);
    obstacles.push({ x: W + 20, w: nagWidth(ni), h, ni, wob: Math.random() * 6 });
  }
  function spawnSong() {
    const colors = ['#f2b8c6', '#b9dea9', '#f3ece0', '#e9d27a'];
    songs.push({ x: W + 20, y: GROUND - 50 - Math.random() * 90, c: colors[Math.floor(Math.random() * colors.length)], got: false, spin: Math.random() });
  }
  function spawnItem() {
    // 봉투(무적)와 헤드폰(잔소리 삭제)을 번갈아 비슷한 비율로
    const kind = Math.random() < 0.55 ? 'envelope' : 'headphones';
    items.push({ kind, x: W + 20, y: GROUND - 70 - Math.random() * 70, spin: Math.random() });
  }
  function pop(x, y, text, color) { pops.push({ x, y, text, color, life: 1 }); }

  function muteAll() {
    for (const o of obstacles) {
      if (o.x < W) pop(o.x + o.w / 2, GROUND - o.h, L().muted, '#9ea5d6');
      o.muted = 1;
    }
    flash = { m: Math.floor(score() / 500), text: L().mutedAll, life: 1.3 };
  }

  // ---------- Update
  function update(dt) {
    t += dt;
    if (state !== 'playing') return;
    speed = Math.min(980, speed + 9 * dt);
    dist += speed * dt;

    // rabbit physics
    const g = holding && rabbit.vy < 0 ? 2100 : 2900;
    rabbit.vy += g * dt;
    rabbit.y += rabbit.vy * dt;
    if (rabbit.y >= GROUND) { rabbit.y = GROUND; rabbit.vy = 0; rabbit.onGround = true; }

    // spawn
    nextObs -= dt; nextSong -= dt;
    if (nextObs <= 0) {
      spawnObstacle();
      const base = 0.75 + 260 / speed;
      nextObs = base + Math.random() * base * 0.9;
    }
    if (nextSong <= 0) { spawnSong(); nextSong = 0.9 + Math.random() * 1.6; }
    nextItem -= dt;
    if (nextItem <= 0) { spawnItem(); nextItem = 9 + Math.random() * 7; }
    if (invincible > 0) invincible = Math.max(0, invincible - dt);

    for (const o of obstacles) {
      o.x -= speed * dt;
      if (o.muted) o.muted -= dt * 3;
      if (o.bounced) { o.bvy += 1800 * dt; o.by += o.bvy * dt; o.x += 420 * dt; o.rot += 6 * dt; }
    }
    for (const s of songs) s.x -= speed * dt;
    for (const it of items) it.x -= speed * dt;
    for (const p of pops) { p.life -= dt * 1.2; p.y -= 40 * dt; }
    obstacles = obstacles.filter(o => o.x + o.w > -20 && !(o.muted < 0) && !(o.bounced && o.by > 200));
    songs = songs.filter(s => s.x > -30 && !s.gone);
    items = items.filter(it => it.x > -30 && !it.got);
    pops = pops.filter(p => p.life > 0);

    // collisions (forgiving hitbox)
    const rx = rabbit.x - rabbit.w / 2 + 7, ry = rabbit.y - rabbit.h + 8, rw = rabbit.w - 14, rh = rabbit.h - 10;
    for (const o of obstacles) {
      if (o.muted || o.bounced) continue;
      const ox = o.x + 4, oy = GROUND - o.h + 4, ow = o.w - 8, oh = o.h - 4;
      if (rx < ox + ow && rx + rw > ox && ry < oy + oh && ry + rh > oy) {
        if (invincible > 0) {
          o.bounced = true; o.by = 0; o.bvy = -520; o.rot = 0;
          pop(rabbit.x + 10, rabbit.y - 56, L().yes, '#f7e8b4');
          continue;
        }
        gameOver(o.ni); return;
      }
    }
    for (const it of items) {
      if (Math.hypot(it.x - rabbit.x, it.y - (rabbit.y - rabbit.h / 2)) < 34) {
        it.got = true;
        if (it.kind === 'envelope') {
          invincible = INVINCIBLE_SEC;
          pop(it.x, it.y - 10, L().gotEnv, '#f7e8b4');
        } else {
          muteAll();
        }
      }
    }
    for (const s of songs) {
      if (s.got) { s.fade -= dt * 3; if (s.fade <= 0) s.gone = true; continue; }
      const cx = rabbit.x, cy = rabbit.y - rabbit.h / 2;
      if (Math.hypot(s.x - cx, s.y - cy) < 30) { s.got = true; s.fade = 1; songCount++; }
    }

    // milestone
    const sc = score();
    const m = Math.floor(sc / 500);
    if (m > 0 && (!flash || flash.m !== m)) flash = { m, text: L().mile(Math.max(0, 400 - m * 50)), life: 1.6 };
    if (flash) flash.life -= dt;
    if (tip > 0) tip -= dt;
  }

  function gameOver(ni) {
    state = 'over';
    const sc = score();
    const record = sc > best;
    if (record) { best = sc; store.set(best); $('best').textContent = best; }
    result = {
      nag: ni, score: sc, songs: songCount, record,
      title: pick(record ? L().records : L().titles),
      wish: pick(L().wishes)
    };
    renderResult();
    $('over').hidden = false;
    overShownAt = performance.now();
    $('retry').focus({ preventScroll: true });
  }

  function renderResult() {
    if (!result) return;
    $('overTitle').textContent = (result.record ? L().records : L().titles)[result.title];
    const hit = $('overHit'), q = document.createElement('q');
    q.textContent = L().nags[result.nag];
    hit.replaceChildren(L().hitBefore, q, L().hitAfter(result.score, result.songs));
    $('overWish').textContent = L().wishes[result.wish];
    // 공유 시트는 클릭 직후에만 열리므로 카드 이미지를 미리 만들어 둔다
    cardBlob = new Promise(res => drawCard().toBlob(res, 'image/png'));
  }

  // ---------- Language
  function applyLang(next) {
    lang = next;
    prefs.set(lang);
    document.documentElement.lang = lang;
    document.title = L().docTitle;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = L()[el.dataset.i18n]; });
    document.querySelector('.explain').hidden = !L().explain;
    for (const b of document.querySelectorAll('.lang button')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    for (const o of obstacles) o.w = nagWidth(o.ni);
    renderResult();
  }
  for (const b of document.querySelectorAll('.lang button')) b.addEventListener('click', () => { applyLang(b.dataset.lang); track(`lang-${lang}`); });
  applyLang(lang);

  // ---------- Drawing
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#10143a'); g.addColorStop(1, '#232a5e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      const x = ((s.x - dist * 0.02) % W + W) % W;
      ctx.globalAlpha = 0.45 + 0.4 * Math.sin(t * 2 + s.p);
      ctx.fillStyle = '#fff6d8';
      ctx.beginPath(); ctx.arc(x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // full moon
    const mx = 640, my = 72, mr = 44;
    const halo = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 2.6);
    halo.addColorStop(0, 'rgba(247,232,180,0.35)'); halo.addColorStop(1, 'rgba(247,232,180,0)');
    ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx, my, mr * 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f7e8b4'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(201,185,131,0.5)';
    [[-14, -10, 9], [12, 8, 7], [-4, 18, 5], [18, -16, 4]].forEach(([dx, dy, r]) => {
      ctx.beginPath(); ctx.arc(mx + dx, my + dy, r, 0, Math.PI * 2); ctx.fill();
    });
  }

  function drawHills(pts, par, color) {
    const off = (dist * par) % 800;
    ctx.fillStyle = color;
    for (const shift of [0, 800]) {
      ctx.beginPath(); ctx.moveTo(pts[0][0] - off + shift, H);
      for (const [x, y] of pts) ctx.lineTo(x - off + shift, y);
      ctx.lineTo(pts[pts.length - 1][0] - off + shift, H); ctx.closePath(); ctx.fill();
    }
  }

  function drawGround() {
    ctx.fillStyle = '#12162f'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = 'rgba(247,232,180,0.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, GROUND + 0.5); ctx.lineTo(W, GROUND + 0.5); ctx.stroke();
    ctx.fillStyle = 'rgba(247,232,180,0.25)';
    const off = dist % 60;
    for (let x = -off; x < W; x += 60) ctx.fillRect(x, GROUND + 14, 22, 2);
    for (let x = -((dist * 1.3) % 97); x < W; x += 97) ctx.fillRect(x + 30, GROUND + 30, 6, 2);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawObstacle(o) {
    const top = GROUND - o.h;
    const bob = Math.sin(t * 6 + o.wob) * 1.5;
    ctx.save(); ctx.translate(0, bob);
    if (o.muted) { ctx.globalAlpha = Math.max(0, o.muted); ctx.translate(o.x + o.w / 2, top + o.h / 2); ctx.scale(o.muted, o.muted); ctx.translate(-(o.x + o.w / 2), -(top + o.h / 2)); }
    if (o.bounced) { ctx.translate(o.x + o.w / 2, top + o.h / 2 + o.by); ctx.rotate(o.rot); ctx.translate(-(o.x + o.w / 2), -(top + o.h / 2)); }
    ctx.fillStyle = '#fbf7ee'; ctx.strokeStyle = '#e0554a'; ctx.lineWidth = 2.5;
    roundRect(o.x, top, o.w, o.h - 6, 10); ctx.fill(); ctx.stroke();
    // tail
    ctx.beginPath(); ctx.moveTo(o.x + o.w - 22, top + o.h - 7); ctx.lineTo(o.x + o.w - 8, GROUND); ctx.lineTo(o.x + o.w - 34, top + o.h - 7);
    ctx.fillStyle = '#fbf7ee'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fbf7ee'; ctx.fillRect(o.x + o.w - 33, top + o.h - 10, 12, 4);
    ctx.fillStyle = '#b8342b'; ctx.font = '17px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(L().nags[o.ni], o.x + o.w / 2, top + (o.h - 6) / 2 + 1, o.w - 14);
    ctx.restore();
  }

  function drawSong(s) {
    ctx.save();
    ctx.translate(s.x, s.y + Math.sin(t * 4 + s.spin * 6) * 3);
    if (s.got) { ctx.globalAlpha = Math.max(0, s.fade); ctx.translate(0, -(1 - s.fade) * 30); }
    ctx.rotate(-0.25);
    ctx.fillStyle = s.c; ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 3, 14, 11, 0, Math.PI, 0); ctx.lineTo(14, 3); ctx.quadraticCurveTo(0, 8, -14, 3); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.moveTo(-11, 1); ctx.quadraticCurveTo(0, -3, 11, 1); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.globalAlpha *= 0.6; ctx.beginPath(); ctx.ellipse(-5, -3, 3, 1.6, -0.4, 0, Math.PI * 2); ctx.fill();
    if (s.got) { ctx.globalAlpha = Math.max(0, s.fade); ctx.rotate(0.25); ctx.fillStyle = '#f7e8b4'; ctx.font = '15px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('+10', 0, -16); }
    ctx.restore();
  }

  function drawItem(it) {
    ctx.save();
    ctx.translate(it.x, it.y + Math.sin(t * 4 + it.spin * 6) * 4);
    // 은은한 후광으로 송편과 구분
    const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 26);
    glow.addColorStop(0, 'rgba(247,232,180,0.45)'); glow.addColorStop(1, 'rgba(247,232,180,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
    if (it.kind === 'envelope') {
      ctx.rotate(-0.12);
      ctx.fillStyle = '#e0554a'; roundRect(-15, -10, 30, 20, 3); ctx.fill();
      ctx.strokeStyle = '#b8342b'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-15, -10); ctx.lineTo(0, 2); ctx.lineTo(15, -10); ctx.stroke();
      ctx.fillStyle = '#f7e8b4'; ctx.beginPath(); ctx.arc(0, 2, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b8342b'; ctx.font = '7px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('福', 0, 2.5);
    } else {
      ctx.strokeStyle = '#eef0ff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 2, 12, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
      ctx.fillStyle = '#eef0ff';
      roundRect(-16, -2, 8, 13, 4); ctx.fill();
      roundRect(8, -2, 8, 13, 4); ctx.fill();
      ctx.fillStyle = '#9ea5d6';
      ctx.fillRect(-14, 2, 4, 5); ctx.fillRect(10, 2, 4, 5);
    }
    ctx.restore();
  }

  function drawPops() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '16px Jua, sans-serif';
    for (const p of pops) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawRabbit() {
    const { x, y } = rabbit;
    if (invincible > 0) {
      // 마지막 1초는 깜빡여서 끝나감을 알림
      const blink = invincible < 1.2 && Math.floor(t * 10) % 2 === 0;
      if (!blink) {
        const r = 34 + Math.sin(t * 8) * 3;
        const g = ctx.createRadialGradient(x, y - 22, 8, x, y - 22, r);
        g.addColorStop(0, 'rgba(247,232,180,0.5)'); g.addColorStop(1, 'rgba(224,85,74,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y - 22, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    const run = state === 'playing' && rabbit.onGround;
    const phase = run ? Math.sin(t * 22) : 0;
    const air = !rabbit.onGround;
    ctx.save(); ctx.translate(x, y);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    const sh = Math.max(0.35, 1 - (GROUND - y) / 160);
    ctx.save(); ctx.translate(0, GROUND - y + 2); ctx.beginPath(); ctx.ellipse(0, 0, 18 * sh, 3.5 * sh, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

    ctx.translate(0, run ? -Math.abs(phase) * 3 : 0);
    const white = '#fbf8f1', shade = '#dcd6e8', pink = '#f2a7b8';
    // hanbok scarf / body
    ctx.fillStyle = white;
    // feet
    ctx.beginPath(); ctx.ellipse(-8 + phase * 4, -3, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8 - phase * 4, -3, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.beginPath(); ctx.ellipse(-2, -15, 16, 13, air ? -0.25 : 0, 0, Math.PI * 2); ctx.fill();
    // tail
    ctx.beginPath(); ctx.arc(-17, -18, 5, 0, Math.PI * 2); ctx.fill();
    // red jeogori sash
    ctx.fillStyle = '#e0554a';
    ctx.beginPath(); ctx.ellipse(1, -17, 11, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2c5a4d'; ctx.fillRect(-2, -22, 7, 3);
    // head
    ctx.fillStyle = white;
    ctx.beginPath(); ctx.ellipse(10, -30, 11, 10, 0, 0, Math.PI * 2); ctx.fill();
    // ears
    const earTilt = air ? 0.55 : 0.25 + phase * 0.08;
    [[4, earTilt], [11, earTilt - 0.15]].forEach(([ex, a]) => {
      ctx.save(); ctx.translate(ex, -37); ctx.rotate(-a);
      ctx.fillStyle = white; ctx.beginPath(); ctx.ellipse(0, -12, 4.5, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = pink; ctx.beginPath(); ctx.ellipse(0, -12, 2, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
    // face
    ctx.fillStyle = '#1a1d33';
    if (state === 'over') {
      ctx.strokeStyle = '#1a1d33'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(12, -34); ctx.lineTo(17, -29); ctx.moveTo(17, -34); ctx.lineTo(12, -29); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(14, -31, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = pink; ctx.beginPath(); ctx.arc(20.5, -28, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(242,167,184,0.5)'; ctx.beginPath(); ctx.ellipse(12, -25, 3, 1.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = shade; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(-4, -9, 10, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    ctx.textBaseline = 'top';
    ctx.font = '18px Jua, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#f7e8b4';
    ctx.fillText(L().hud(songCount), 18, 14);
    ctx.textAlign = 'right';
    ctx.fillText(String(score()).padStart(5, '0'), W - 18, 14);
    ctx.fillStyle = 'rgba(247,232,180,0.55)'; ctx.font = '13px Jua, sans-serif';
    ctx.fillText(`HI ${String(best).padStart(5, '0')}`, W - 18, 36);

    if (invincible > 0) {
      ctx.textAlign = 'left'; ctx.fillStyle = '#e0554a'; ctx.font = '13px Jua, sans-serif';
      ctx.fillText(L().inv, 18, 40);
      const bx = 18 + ctx.measureText(L().inv).width + 8;
      ctx.fillStyle = 'rgba(247,232,180,0.2)'; ctx.fillRect(bx, 43, 80, 6);
      ctx.fillStyle = '#f7e8b4'; ctx.fillRect(bx, 43, 80 * invincible / INVINCIBLE_SEC, 6);
    }

    if (tip > 0 && state === 'playing' && !(flash && flash.life > 0)) {
      ctx.globalAlpha = Math.min(1, tip * 2);
      ctx.font = '20px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const text = '⤒ ' + L().tip, tw = ctx.measureText(text).width;
      ctx.fillStyle = '#f7e8b4'; roundRect(W / 2 - tw / 2 - 16, 58, tw + 32, 34, 17); ctx.fill();
      ctx.fillStyle = '#0b0f26'; ctx.fillText(text, W / 2, 76);
      ctx.globalAlpha = 1; ctx.textBaseline = 'top';
    }
    if (flash && flash.life > 0 && state === 'playing') {
      ctx.globalAlpha = Math.min(1, flash.life);
      ctx.textAlign = 'center'; ctx.font = '22px Jua, sans-serif'; ctx.fillStyle = '#f7e8b4';
      ctx.fillText(flash.text, W / 2, 60);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- 기록 카드 (1080×1080 정사각형, 게임 그리기 함수를 확대해서 재사용)
  function drawCard() {
    const S = 1080, FLOOR = 900;
    const c = document.createElement('canvas'); c.width = c.height = S;
    const main = ctx, savedRabbit = rabbit, savedState = state;
    ctx = c.getContext('2d');
    const at = (x, y, k, draw) => { ctx.save(); ctx.translate(x, y); ctx.scale(k, k); draw(); ctx.restore(); };
    const fit = (text, size, maxW) => {
      for (; size > 20; size -= 2) { ctx.font = `${size}px Jua, sans-serif`; if (ctx.measureText(text).width <= maxW) break; }
    };
    try {
      const g = ctx.createLinearGradient(0, 0, 0, S);
      g.addColorStop(0, '#10143a'); g.addColorStop(1, '#262d63');
      ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
      ctx.fillStyle = '#fff6d8';
      for (const s of stars) {
        ctx.globalAlpha = 0.3 + s.r * 0.35;
        ctx.beginPath(); ctx.arc(s.x / W * S, s.y / GROUND * 760, s.r * 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      const mx = 870, my = 210, mr = 120;
      const halo = ctx.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 2.4);
      halo.addColorStop(0, 'rgba(247,232,180,0.35)'); halo.addColorStop(1, 'rgba(247,232,180,0)');
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx, my, mr * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f7e8b4'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(201,185,131,0.5)';
      [[-14, -10, 9], [12, 8, 7], [-4, 18, 5], [18, -16, 4]].forEach(([dx, dy, r]) => {
        const k = mr / 44; ctx.beginPath(); ctx.arc(mx + dx * k, my + dy * k, r * k, 0, Math.PI * 2); ctx.fill();
      });

      for (const [pts, color] of [[farHills, '#1b2150'], [nearHills, '#243056']]) {
        ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, S);
        for (const [x, y] of pts) ctx.lineTo(x * 1.4, FLOOR + (y - GROUND) * 2.4);
        ctx.lineTo(S, S); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#12162f'; ctx.fillRect(0, FLOOR, S, S - FLOOR);
      ctx.strokeStyle = 'rgba(247,232,180,0.55)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, FLOOR); ctx.lineTo(S, FLOOR); ctx.stroke();

      // 제목과 점수
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#c9b983'; ctx.font = '32px "Gowun Dodum", sans-serif';
      ctx.fillText(L().eyebrow, 80, 120);
      ctx.fillStyle = '#f7e8b4'; fit(L().title, 88, 620);
      ctx.fillText(L().title, 80, 215);

      ctx.fillStyle = '#9ea5d6'; ctx.font = '40px Jua, sans-serif';
      ctx.fillText(L().cardScore, 80, 340);
      if (result.record) {
        const lx = 80 + ctx.measureText(L().cardScore).width + 20;
        ctx.font = '30px Jua, sans-serif';
        const pw = ctx.measureText(L().cardRecord).width + 40;
        ctx.fillStyle = '#e0554a'; roundRect(lx, 300, pw, 50, 25); ctx.fill();
        ctx.fillStyle = '#fbf7ee'; ctx.fillText(L().cardRecord, lx + 20, 336);
      }
      ctx.fillStyle = '#f7e8b4'; ctx.font = '200px Jua, sans-serif';
      ctx.fillText(String(result.score), 72, 530);
      ctx.fillStyle = '#eef0ff'; ctx.font = '40px Jua, sans-serif';
      ctx.fillText(L().cardSongs(result.songs), 80, 605);

      // 달토끼와 쓰러뜨린 잔소리
      rabbit = { x: 0, y: GROUND, vy: 0, w: 36, h: 40, onGround: true };
      state = result.record ? 'ready' : 'over';
      at(200, FLOOR - GROUND * 4.5, 4.5, drawRabbit);
      const o = { x: 0, w: nagWidth(result.nag), h: 34, ni: result.nag, wob: 0 };
      at(420, FLOOR - GROUND * 3, 3, () => drawObstacle(o));
      ctx.fillStyle = '#9ea5d6'; ctx.font = '30px Jua, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(L().cardHit, 424, 775);
      at(360, 690, 2.6, () => drawSong({ x: 0, y: 0, c: '#f2b8c6', spin: 0 }));
      at(990, 700, 2.6, () => drawSong({ x: 0, y: 0, c: '#b9dea9', spin: 0.4 }));

      // 덕담과 주소
      ctx.textAlign = 'center';
      ctx.fillStyle = '#eef0ff'; ctx.font = '32px "Gowun Dodum", sans-serif';
      ctx.fillText(L().wishes[result.wish], S / 2, 975, S - 120);
      ctx.fillStyle = '#c9b983'; ctx.font = '30px Jua, sans-serif';
      ctx.fillText('areumseo.com/moon-rabbit-run', S / 2, 1035);
    } finally {
      ctx = main; rabbit = savedRabbit; state = savedState;
    }
    return c;
  }

  function render() {
    drawSky();
    drawHills(farHills, 0.12, '#1b2150');
    drawHills(nearHills, 0.3, '#243056');
    drawGround();
    for (const s of songs) drawSong(s);
    for (const it of items) drawItem(it);
    for (const o of obstacles) drawObstacle(o);
    drawRabbit();
    drawPops();
    drawHUD();
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); render();
    requestAnimationFrame(loop);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
  requestAnimationFrame(loop);
})();
</script>
